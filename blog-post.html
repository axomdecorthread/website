			const posts = {
				"stories-hidden-in-assamese-clothes": {
					meta: "Heritage · Textiles",
					title: "The Stories Hidden in Assamese Clothes",
					subtitle: "A Mekhela Sador. A Gamosa. The unmistakable sheen of Muga silk. Behind these familiar forms is a much bigger story.",
					author: "Himadri Barua Choudhury",
					date: "28 Sep, 2026",
					description: "Assamese clothes are easy to recognise — a Mekhela Sador, a Gamosa, the sheen of Muga silk. Behind these familiar forms is a story of trade routes, royal courts, village looms and generations of women who turned thread into identity.",
					image: "./res/img/hero-01.webp",
					footnote: "The history of Assamese textiles is documented across textile studies, cultural research and heritage collections, including work on Muga and Eri practices, Assam's silk handloom industry, Assamese women's dress, Tai-Ahom clothing traditions and the wider textile traditions of Assam.",
					html: `
						<p class="lede">Assamese clothes are easy to recognise. A Mekhela Sador. A Gamosa. The unmistakable sheen of Muga silk.</p>
						<p>But behind these familiar forms is a much bigger story — one of trade routes, royal courts, village looms, changing kingdoms, community traditions and generations of women who turned thread into identity.</p>
						<p>And some of the most interesting parts of that story are hiding in plain sight.</p>

						<h2>The silk that grows golden</h2>
						<p>Muga silk is perhaps Assam's most famous textile.</p>
						<p>What makes it unusual is not simply its strength or texture. It has a naturally warm, golden sheen that becomes richer with age and use. Unlike many textiles that fade or wear out, Muga can develop an even deeper character over time.</p>
						<p>For centuries, it has been associated with Assam's cultural and social life — particularly ceremonial clothing.</p>
						<p>But Muga is only one part of Assam's silk tradition.</p>
						<p>There is also <strong>Eri</strong>, known for its soft, warm texture, and <strong>Pat</strong>, the smooth white silk traditionally valued for its fine appearance.</p>
						<p>Together, Muga, Eri and Pat form one of the defining foundations of Assamese weaving.</p>
						<hr>

						<h2>Before the boutique, there was the household loom</h2>
						<p>Assam's weaving tradition did not begin in fashion studios.</p>
						<p>It lived inside homes.</p>
						<p>For generations, weaving was part of everyday household life. A loom could be found in villages across Assam, and women played a central role in producing clothing for the family.</p>
						<p>This made clothing more than something bought and worn.</p>
						<p>It could be grown, spun, dyed, woven and finished within the community.</p>
						<p>A garment could therefore carry something surprisingly personal: the skill of the person who made it.</p>
						<hr>

						<h2>The Mekhela Sador wasn't just clothing</h2>
						<p>Today, the <strong>Mekhela Sador</strong> is one of the most recognisable forms of Assamese dress.</p>
						<p>But it is more than a standardised costume.</p>
						<p>Its forms, fabrics, colours and motifs have evolved through time and across communities.</p>
						<p>The Mekhela forms the lower portion of the ensemble, while the Sador is draped over the upper body. Different weaving traditions give the garments very different personalities — from understated everyday cottons to elaborate silk pieces with intricate borders.</p>
						<p>What looks like a simple silhouette can therefore tell you a lot about where a textile came from, who made it and when it might have been worn.</p>
						<hr>

						<h2>Silk, status and the royal court</h2>
						<p>Assam's silk traditions also have a connection with the Ahom period.</p>
						<p>The Ahoms ruled Assam for nearly six centuries, from the 13th century until the early 19th century. During this long period, weaving and textiles became closely connected with courtly life, ceremonial occasions and systems of patronage.</p>
						<p>Textiles were not simply commodities.</p>
						<p>They could signify status.</p>
						<p>Fine fabrics could be presented as gifts, used in ceremonies and associated with important occasions.</p>
						<p>The court therefore helped reinforce the importance of weaving — but the craft itself remained deeply rooted in village households.</p>
						<p>That combination is important.</p>
						<p>Assamese textile culture grew simultaneously from <strong>royal patronage and ordinary domestic weaving</strong>.</p>
						<hr>

						<h2>The Gamosa has a story of its own</h2>
						<p>The Gamosa may look deceptively simple: usually a rectangular piece of woven cloth, often white with a distinctive red border and motifs.</p>
						<p>But its cultural role is anything but simple.</p>
						<p>It appears in religious ceremonies, festivals, social occasions and everyday life. It can be offered as a gesture of respect, used in worship, worn or presented to someone as a mark of honour.</p>
						<p>Its power lies partly in that versatility.</p>
						<p>It isn't merely a decorative textile.</p>
						<p>It is something that can move between the personal, social and ceremonial worlds.</p>
						<hr>

						<h2>Look closely at the motifs</h2>
						<p>Assamese textiles often speak through their patterns.</p>
						<p>Floral forms, geometric designs, animals, birds and other motifs appear across different weaving traditions.</p>
						<p>These aren't always just decoration.</p>
						<p>Patterns can reflect the natural environment around the weaver, local aesthetic traditions and inherited visual vocabulary.</p>
						<p>And because weaving skills are passed between generations, motifs themselves can become a kind of visual inheritance.</p>
						<p>A pattern seen on a contemporary Mekhela Sador may therefore have a much older story behind it.</p>
						<hr>

						<h2>Assam doesn't have just one weaving tradition</h2>
						<p>One of the easiest mistakes is to think of Assamese textiles as a single uniform tradition.</p>
						<p>Assam is home to many communities, each with its own clothing traditions, weaving techniques, motifs and ways of using textiles.</p>
						<p>Bodo, Dimasa, Tai-Ahom and other communities have distinctive textile cultures of their own.</p>
						<p>Even within the broader Assamese tradition, clothing can vary considerably between regions and occasions.</p>
						<p>So when we talk about &ldquo;Assamese clothes&rdquo;, we're really talking about a collection of traditions that have lived alongside one another for centuries.</p>
						<hr>

						<h2>Festivals put everything on display</h2>
						<p>If you want to see how deeply textiles are embedded in Assamese life, look at the festivals.</p>
						<p>Bihu is perhaps the most visible example.</p>
						<p>Traditional clothing becomes part of celebration, performance, gifting and social interaction. Bright borders, woven motifs and silk garments appear alongside music and dance.</p>
						<p>Here, clothing isn't a costume added to the celebration.</p>
						<p>It is part of the celebration itself.</p>
						<hr>

						<h2>The loom as a record of place</h2>
						<p>There is another reason Assamese textiles are fascinating.</p>
						<p>They preserve geography.</p>
						<p>Different communities developed different preferences for fibres, colours, motifs and techniques. The availability of particular plants, silkworms and natural resources influenced what could be woven.</p>
						<p>The result is a textile landscape that reflects Assam's extraordinary ecological and cultural diversity.</p>
						<p>In that sense, a piece of cloth can be a small map.</p>
						<p>It can tell you something about the landscape where its raw materials came from, the community that wove it and the occasions for which it was intended.</p>
						<hr>

						<h2>From village loom to modern fashion</h2>
						<p>The story doesn't end with tradition.</p>
						<p>Assamese textiles have increasingly moved into contemporary fashion — appearing in modern silhouettes, jackets, dresses, sarees, accessories and interior products.</p>
						<p>Designers have experimented with traditional motifs and fabrics while adapting them to changing tastes.</p>
						<p>But the most interesting evolution isn't necessarily about making Assamese textiles look &ldquo;modern&rdquo;.</p>
						<p>It is about allowing an old textile tradition to remain recognisably itself while finding new places in contemporary life.</p>
						<p>That is a very different kind of modernisation.</p>
						<hr>

						<h2>Cloth that remembers</h2>
						<p>There is something remarkable about Assamese textiles.</p>
						<p>A piece of silk can carry the memory of a landscape.</p>
						<p>A motif can carry the memory of a community.</p>
						<p>A weaving technique can carry the memory of a household.</p>
						<p>And a garment can carry all three.</p>
						<p>That is why the Mekhela Sador, the Gamosa and Assam's many silk traditions are more than beautiful objects.</p>
						<p>They are records.</p>
						<p>Records of people, places, celebrations, craftsmanship and centuries of cultural exchange.</p>
						<p class="closing">The next time you see a piece of Assamese textile, look beyond the colour and the pattern. There may be a much older story woven into it.</p>
					`
				}
			};

				}

				document.getElementById("postSubtitle").textContent = post.subtitle || "";
				document.getElementById("postByline").innerHTML = post.author
					? `By <span class="author">${post.author}</span>` + (post.date ? ` &middot; ${post.date}` : "")

			} else {
				document.getElementById("postMeta").textContent = "";
				document.getElementById("postTitle").textContent = "Story not found";

				document.getElementById("postFootnoteText").textContent = "";
				bodyEl.innerHTML = `<p>We couldn't find that story. <a href="./blog.html">Browse all stories &rarr;</a></p>`;
			}
